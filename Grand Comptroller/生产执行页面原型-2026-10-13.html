const workorderLabel=t=>woById(t.wo).number;
function selectScope(id){scope=id;selected=(scopedTasks()[0]||{}).id||null;search='';filter='all';executorFilter='all';}
function openWorkorder(id,next='overview'){selectScope(id);attentionFilter='all';view=next;render();}
const received=j=>j.receipts.reduce((s,r)=>s+r.qty,0);
const transfers=t=>state.transfers.filter(j=>j.task===t.id);
const sentSum=t=>transfers(t).reduce((s,j)=>s+j.sent,0);
const receivedSum=t=>transfers(t).reduce((s,j)=>s+received(j),0);
const badge=(text,style='neutral')=>`<span class="badge ${style}">${esc(text)}</span>`;
const date=d=>d?d.slice(5).replace('-',' / '):'待确认';
const days=(a,b)=>a&&b?Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000):null;
const routeText={internal:'厂内交接',return:'外协回厂',direct:'外协直送'};
function status(t){return t.done===t.qty?(t.rework?'加工已完成 · 有返工':'加工已完成'):(t.started?'在制':'尚未开工');}
function risks(t){let a=taskSignals(t);return a.length?a.map(z=>`<div class="attention-line">${badge(z.label,z.tone)}${esc(z.text)}</div>`).join(''):badge('无已记录异常','neutral');}
function qText(t){return t.needQ===null?'质量要求待确认':t.needQ===false?'本次不适用':t.qpass===null?'结果待确认':`合格 ${t.qpass} / 不合格 ${t.qfail}`;}
function notice(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').hidden=true,4000);}
function options(arr,value){return arr.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('');}
function projectStrip(){let w=woById(scope);return `<div class="project"><div><span>查看范围</span><select id="scope" aria-label="选择工单" style="width:auto;max-width:100%">${view!=='overview'?`<option value="all" ${scope==='all'?'selected':''}>全部工单 · 跨工单查看</option>`:''}${state.workorders.map(x=>`<option value="${x.id}" ${scope===x.id?'selected':''}>${esc(x.number+' · '+x.equipment)}</option>`).join('')}</select></div>${w?`<div><span>项目 / 合同</span><strong>${esc(w.project)}</strong><span>${esc(w.contract)}</span></div><div><span>生产项目负责人 / 交期</span><strong>负责人${w.lead} · ${esc(w.due)}</strong></div>`:'<div><span>跨工单查看</span><strong>每条任务保留工单归属</strong><span>可按班组或外协集中查看</span></div>'}<div class="actions"><button id="backLibrary">返回工单库</button>${w&&view!=='overview'?'<button id="goOverview">工单详情</button>':''}</div></div>`;}
function taskSignals(t){let a=[];if(state.demo){const d=demo(t.wo);if(d.supplier!=='active'&&t.executor.includes('外协'))a.push({kind:'blocked',label:'资格风险',tone:'bad',text:'虚构资格停用或待核实；既有任务保留，禁止新增外协安排'});if(t.id==='A03'&&d.pause)a.push({kind:'blocked',label:'技术暂停',tone:'bad',text:'连接件 2 件暂停，需技术落实与现场恢复双确认'});}if(t.blocker)a.push({kind:'blocked',label:'阻塞',tone:'bad',text:t.blocker});if(t.rework||t.qfail)a.push({kind:'quality',label:t.rework?'返工':'不合格',tone:'bad',text:t.rework?`${t.rework} 件返工需跟进`:`QMS 示例记录 ${t.qfail} 件不合格`});if(t.unknown)a.push({kind:'unknown',label:'待确认',tone:'neutral',text:`最新进展待核实，上次确认 ${date(t.confirmed)}；保留上次已知记录`});else if(t.done<t.qty&&days(t.forecast,t.due)>0)a.push({kind:'late',label:'预计偏差',tone:'warn',text:`本工序要求 ${date(t.due)}，预计 ${date(t.forecast)}，晚 ${days(t.forecast,t.due)} 天`});if(!t.unknown&&t.done<t.qty&&!t.forecast)a.push({kind:'unknown',label:'预计待确认',tone:'neutral',text:'本工序预计完成日期尚未填写'});if(t.done>0&&t.needQ===true&&(t.qpass===null||t.done>t.qpass+(t.qfail||0)))a.push({kind:'waiting',label:'质量待确认',tone:'neutral',text:`已加工 ${t.done} 件，${t.qpass===null?'尚无检验结果':'部分结果待核实'}；后续放行以 QMS 为准`});if(t.needQ===null)a.push({kind:'unknown',label:'质量要求待确认',tone:'neutral',text:'本安排适用质量要求尚未核实'});return a;}
function transferSignals(j){let a=[],t=tById(j.task);if(j.route!=='return'&&(j.qualityException||j.note.includes('质量依据不足')||t.needQ===null||(t.needQ===true&&(j.qAtSend===null||j.qAtSend<j.sent))))a.push({kind:'quality',label:'放行依据不足',tone:'bad',text:'已发生转序交接，登记时质量放行依据不足，需核实实际放行情况'});if(!j.receipts.length)a.push({kind:'unknown',label:'接收待确认',tone:'neutral',text:`已交出 ${j.sent} 件，尚无接收反馈`});else if(received(j)!==j.sent)a.push({kind:'difference',label:'数量差异',tone:'bad',text:`交出 ${j.sent} 件，确认收到 ${received(j)} 件，相差 ${Math.abs(j.sent-received(j))} 件待核实`});return a;}
const rank={bad:3,warn:2,neutral:1};
function orderAttention(wo){let a=state.tasks.filter(t=>t.wo===wo).map(t=>({id:t.id,task:t,signals:taskSignals(t),transfer:null})).filter(x=>x.signals.length);state.transfers.filter(j=>tById(j.task).wo===wo).forEach(j=>{let xs=transferSignals(j);if(xs.length)a.push({id:j.id,task:tById(j.task),signals:xs,transfer:j});});a.forEach(x=>x.score=Math.max(...x.signals.map(z=>rank[z.tone])));return a.sort((a,b)=>b.score-a.score);}
function orderTone(w){let a=orderAttention(w.id);return a.length?a[0].signals.find(x=>rank[x.tone]===a[0].score).tone:'neutral';}
function attentionMatch(x,k){return k==='all'||x.signals.some(z=>k==='blocked'?['blocked','quality','difference'].includes(z.kind):k==='late'?z.kind==='late':k==='unknown'?['unknown','waiting'].includes(z.kind):false);}
function attentionRow(x){let t=x.task;return `<div class="attention-item" data-attention="${x.id}"><div>${x.signals.map(z=>badge(z.label,z.tone)).join(' ')}<p class="quiet">跟进：负责人${woById(t.wo).lead}</p></div><div><h3>${esc(t.name)} · ${esc(t.op)}</h3><p class="quiet">${esc(t.code)} · ${esc(x.transfer?x.transfer.from+' → '+x.transfer.to:t.executor)}</p>${x.signals.map(z=>`<p class="reason">${esc(z.text)}</p>`).join('')}</div><div class="actions">${x.transfer?`<button class="jump-handoff" data-id="${x.id}">查看交接</button>${canEdit(t)?`<button class="primary edit-receipt" data-id="${x.id}">核实接收</button>`:''}`:`<button class="jump-task" data-id="${t.id}">查看任务</button>${canEdit(t)?`<button class="primary edit-progress" data-id="${t.id}">更新进度</button>`:''}`}</div></div>`;}
function woRisk(w){let ts=state.tasks.filter(t=>t.wo===w.id);return ts.filter(t=>t.blocker||t.unknown||t.rework||(days(t.forecast,t.due)>0&&t.done<t.qty)).length;}
function woDifferences(w){return state.transfers.filter(j=>tById(j.task).wo===w.id&&(!j.receipts.length||received(j)!==j.sent)).length;}
function renderLibrary(){let ws=state.workorders.filter(w=>(libraryBusiness==='all'||w.business===libraryBusiness)&&(libraryLead==='all'||w.lead===libraryLead)&&(libraryStatus==='all'||(libraryStatus==='risk'&&orderAttention(w.id).length)||(libraryStatus==='mine'&&w.lead===leadIdentity))&&(!librarySearch||[w.number,w.project,w.contract,w.customer,w.equipment].join(' ').toLowerCase().includes(librarySearch.toLowerCase()))).sort((a,b)=>rank[orderTone(b)]-rank[orderTone(a)]);return `<div class="heading"><div><h1>工单状态</h1><p>先看设备做到哪里、卡在哪里，再进入工单跟进。</p></div><button id="allProduction">按执行方查看任务</button></div><div class="status-tabs">${[['all','全部工单'],['risk','需关注工单'],['mine','我负责的工单']].map(([k,l])=>`<button data-library-tab="${k}" aria-pressed="${libraryStatus===k}">${l}</button>`).join('')}</div><section class="panel"><div class="toolbar"><input class="library-search" id="librarySearch" aria-label="搜索工单" value="${esc(librarySearch)}" placeholder="查找工单、设备、项目或客户"><details class="extra-filters" ${libraryBusiness!=='all'||libraryLead!=='all'?'open':''}><summary>更多筛选</summary><div class="toolbar"><select id="libraryBusiness" aria-label="筛选事业部" style="width:auto"><option value="all">所有事业部</option>${options([...new Set(state.workorders.map(w=>w.business))],libraryBusiness)}</select><select id="libraryLead" aria-label="筛选负责人" style="width:auto"><option value="all">所有负责人</option>${options(['甲','乙'],libraryLead)}</select></div></details></div><div class="table-wrap"><table class="status-board"><thead><tr><th>工单 / 设备</th><th>当前阶段</th><th>合同交期</th><th>需要关注什么</th><th>跟进负责人</th></tr></thead><tbody>${ws.map(w=>{let a=orderAttention(w.id),tone=orderTone(w);return `<tr data-tone="${tone}" data-workorder="${w.id}"><td><button class="link open-wo" data-wo="${w.id}">${esc(w.number)}</button><span class="sub">${esc(w.equipment)}</span><span class="sub">${esc(w.project)} · ${esc(w.customer)}</span></td><td><span class="state-title">${esc(w.acceptance?'履约完成':w.stage)}</span><span class="sub">${w.acceptance?'客户已签字验收':'客户尚未签字验收'}</span></td><td>${esc(w.due)}<span class="sub">预计首批发货 ${esc(state.demo?forecast(demo(w.id)).status:"待评估")}</span></td><td>${a.length?a.slice(0,2).map(x=>{let z=x.signals[0];return `<div class="attention-line">${badge(z.label,z.tone)}<strong>${esc(x.task.name)}</strong><div class="reason">${esc(z.text)}</div></div>`;}).join(''):'<div class="quiet">无已记录异常</div>'}${a.length>2?`<button class="link open-wo" data-wo="${w.id}">查看全部 ${a.length} 项关注事项</button>`:''}</td><td>负责人${w.lead}<span class="sub">${esc(w.business)}</span><button class="link open-wo" data-wo="${w.id}">进入工单</button></td></tr>`;}).join('')||'<tr><td colspan="5" class="empty">没有符合条件的工单，请调整搜索或筛选。</td></tr>'}</tbody></table></div><p class="attention-legend">红色：阻塞、返工或数量差异　黄色：工序预计节点偏差　灰色：信息待确认。颜色与文字一起读；局部异常不直接等于设备交期延期。</p></section>`;}

function footer(){return `<div class="footer"><details><summary>原型范围与说明</summary><p>数据均为虚构，修改只保留在当前页面。状态来自示例录入，异常排序和显示方式为设计建议；负责人身份仅演示维护范围。QMS 结果为只读快照，接口和批次匹配尚待核实。已交出与已收到分开展示；返工往返、零件配套及总成换算尚未实现。</p></details></div>`;}

function render(){if(view==='overview'&&scope==='all'){view='library';notice('请选择一个工单查看设备详情。');}document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));$('main').className=view==='progress'?'progress-surface':'';$('main').innerHTML=({library:renderLibrary,progress:renderProgress,dispatch:renderDispatch,handoff:renderHandoff,overview:renderOverview}[view])()+footer();bindView();}
function renderProgress(){let list=scopedTasks().slice().sort((a,b)=>Math.max(0,...taskSignals(b).map(z=>rank[z.tone]))-Math.max(0,...taskSignals(a).map(z=>rank[z.tone]))).filter(t=>(executorFilter==='all'||t.executor===executorFilter)&&(!search||[workorderLabel(t),t.name,t.code,t.op,t.executor].join(' ').toLowerCase().includes(search.toLowerCase()))&&(filter==='all'||(filter==='risk'&&taskSignals(t).length)||(filter==='active'&&t.started&&t.done<t.qty)));
if(!list.some(t=>t.id===selected))selected=null;return `<div class="heading"><div><h1>进度更新</h1><p>按图号和工序跟进，正常任务快速确认，异常单独处理。</p></div>${role==='lead'?'<button id="bulk" class="primary">确认所选进展未变</button>':badge('当前角色只读','neutral')}</div>${projectStrip()}<div class="split"><section class="panel"><div class="toolbar"><input id="search" aria-label="搜索任务" placeholder="搜索工单、图号、部件、执行方" value="${esc(search)}"><select id="exFilter" aria-label="按执行方查看" style="width:auto"><option value="all">所有班组 / 外协</option>${options([...new Set(scopedTasks().map(t=>t.executor))],executorFilter)}</select><select id="filter" aria-label="按情况查看" style="width:auto"><option value="all" ${filter==='all'?'selected':''}>全部任务</option><option value="active" ${filter==='active'?'selected':''}>在制任务</option><option value="risk" ${filter==='risk'?'selected':''}>异常 / 待确认</option></select></div><div class="table-wrap"><table><thead><tr><th>${role==='lead'?'<input id="allcheck" type="checkbox" aria-label="选择全部可确认任务">':''}</th><th>部件 / 图号</th><th>工序 / 执行方</th><th>分配 / 已完工</th><th>工序节点</th><th>跟进情况</th></tr></thead><tbody>${list.map(t=>`<tr class="${t.id===selected?'selected':''}"><td>${canEdit(t)?`<input class="rowcheck" type="checkbox" value="${t.id}" aria-label="选择 ${esc(t.name)}" ${t.unknown?'disabled title="最新情况待确认，请单独更新"':''}>`:''}</td><td><button class="link select-task" data-id="${t.id}">${esc(t.name)}</button><span class="sub mono">${t.code}</span><span class="sub">${esc(workorderLabel(t))} · 负责人${woById(t.wo).lead} · ${t.pkg}</span></td><td>${esc(t.op)}<span class="sub">${esc(t.executor)}</span></td><td><strong>${t.qty} / ${t.done}</strong><span class="sub">${status(t)}</span></td><td>要求 ${date(t.due)}<span class="sub">${t.unknown?'上次预计':'当前预计'} ${date(t.forecast)}</span><span class="sub">最近确认 ${date(t.confirmed)}</span></td><td>${risks(t)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有符合条件的任务</td></tr>'}</tbody></table></div><p class="legend-line">数量按每条图号分别查看；预计日期不修改原要求日期。待确认明细请单独核实，不能批量视为最新。</p></section>${selected?`<details id="taskDetail" class="inline-detail"><summary>查看 ${esc(tById(selected).name)} 的数量、质量与流转明细</summary>${detail(tById(selected))}</details>`:''}</div>`;}
function detail(t){let hist=state.logs.filter(l=>l.task===t.id).slice(-3).reverse();let js=transfers(t);return `<aside class="panel detail"><div class="detail-head"><span class="small quiet">${esc(t.code)} · ${esc(t.op)}</span><p><strong>${esc(t.name)}</strong></p><p class="small quiet">${esc(workorderLabel(t))} · 负责人${woById(t.wo).lead}<br>${esc(t.executor)} · ${esc(t.pkg)}</p></div><div><dl class="kv"><dt>分配 / 加工完成</dt><dd>${t.qty} / ${t.done} 件</dd><dt>计划节点</dt><dd>${esc(t.plan)}</dd><dt>安排要求</dt><dd>${esc(t.due||'仅优先顺序')}</dd><dt>${t.unknown?'上次预计':'当前预计'}</dt><dd>${esc(t.forecast||'待确认')}</dd><dt>开工数量</dt><dd>${t.startQty===null?'未掌握 · 非每日必填':t.startQty+' 件'}</dd><dt>先后要求</dt><dd>${esc(t.priority||'无单独要求')}</dd></dl>${canEdit(t)?`<div class="actions"><button class="primary edit-progress" data-id="${t.id}">更新进度</button><button class="new-transfer" data-id="${t.id}">登记交接</button></div>`:''}${role==='planner'?`<button class="reassign" data-id="${t.id}">转派未开工部分</button>`:''}<div class="callout">${t.blocker?esc(t.blocker):'未记录阻塞。'}${t.rework?'<br>示例有 '+t.rework+' 件待返工，不因首次加工完成就认为全部工作结束。':''}</div></div><div class="section-line"><h3>质量依据 · 演示 QMS 快照</h3><p style="margin:0">${badge(qText(t),t.qfail?'bad':t.needQ===null||(t.qpass===null&&t.needQ)?'warn':t.needQ===false?'neutral':'ok')}</p><p class="small quiet">${esc(t.qref)}<br>${esc(t.qwhere)}</p><h3>本执行安排的实际流转</h3><p class="small">已交出 ${sentSum(t)} 件 / 已确认收到 ${receivedSum(t)} 件</p>${js.map(j=>`<div class="small">${routeText[j.route]} → ${esc(j.to)}<br>${j.sent} 件交出，${received(j)} 件收到 ${received(j)!==j.sent?badge('数量待核实','warn'):''}</div>`).join('')||'<p class="small quiet">尚无交接记录。</p>'}<p class="flowhint">外协回厂可先接收、再检验。交接不自动生成下道开工；不同路径不可直接用合格数量减去所有接收数量。</p></div><div class="section-line"><h3>最近进度记录</h3><div class="activity">${hist.map(l=>`<div><span class="quiet">${esc(l.date)}</span><br>${esc(l.text)}</div>`).join('')||'<span class="quiet">尚无补充记录</span>'}</div></div></aside>`;}
function remaining(d){return d.qty-state.tasks.filter(t=>t.demand===d.id).reduce((s,t)=>s+t.qty,0);}
function renderDispatch(){return `<div class="heading"><div><h1>任务安排</h1><p>同一工单、一道工序、一个执行方，多个图号可以整包安排。</p></div>${role==='planner'?'<button id="dispatchNew" class="primary">安排所选部件</button>':badge('切换统一派工负责人可操作')}</div>${projectStrip()}<div class="split"><section class="panel"><h2>待安排的部件工序</h2><div class="table-wrap"><table><thead><tr><th>选择</th><th>部件 / 图号</th><th>工序</th><th>需求 / 未安排</th><th>计划节点</th></tr></thead><tbody>${scopedDemands().map(d=>`<tr><td><input class="dcheck" type="checkbox" value="${d.id}" aria-label="选择 ${esc(d.name)}" ${role!=='planner'||remaining(d)===0?'disabled':''}></td><td>${esc(d.name)}<span class="sub mono">${d.code}</span><span class="sub">${esc(woById(d.wo).number)}</span></td><td>${esc(d.op)}</td><td>${d.qty} / <span class="count">${remaining(d)}</span></td><td>${date(d.plan)}</td></tr>`).join('')}</tbody></table></div><div class="callout info">示例需求已人工确认。实际 BOM 与料单导入规则待核实；保存安排只指定执行方，不代表已通知、实物已接收或已开工。</div><h2 class="section-line">已安排任务</h2><div class="table-wrap"><table><thead><tr><th>任务包</th><th>部件 / 工序</th><th>执行方</th><th>分配 / 完工</th><th>操作</th></tr></thead><tbody>${scopedTasks().map(t=>`<tr><td>${esc(t.pkg)}<span class="sub">${esc(workorderLabel(t))}</span></td><td>${esc(t.name)}<span class="sub">${esc(t.op)} · ${t.code}</span></td><td>${esc(t.executor)}</td><td>${t.qty} / ${t.done}</td><td>${role==='planner'?`<button class="link reassign" data-id="${t.id}" ${t.qty<=t.done?'disabled':''}>转派未开工部分</button>`:'只读'}</td></tr>`).join('')}</tbody></table></div></section><aside class="panel"><h2>执行方已有工作 · 跨工单</h2><p class="small quiet">此侧栏始终显示所有示例工单的已知任务，便于安排资源。</p>${[...new Set(state.tasks.map(t=>t.executor))].map(ex=>`<div class="resource"><strong>${esc(ex)}</strong>${state.tasks.filter(t=>t.executor===ex).map(t=>`<p>${esc(t.name)} · ${esc(t.op)}<br><span class="mono">${esc(workorderLabel(t))}</span><br>${status(t)} · ${t.unknown?'上次预计':'预计'} ${date(t.forecast)}</p>`).join('')}</div>`).join('')}<p class="flowhint">多个图号是同一个任务包的明细。拆分和转派保持总需求不变，已开工部分保留原执行方。</p></aside></div>`;}
function renderHandoff(){return `<div class="heading"><div><h1>交接与差异</h1><p>记录真实交出方和接收方，生产项目负责人牵头核实数量差异。</p></div>${role==='lead'?'<button id="chooseTransfer" class="primary">登记一批交接</button>':badge('当前角色只读')}</div>${projectStrip()}<section class="panel"><div class="table-wrap"><table><thead><tr><th>记录 / 部件</th><th>路径 / 实际收发方</th><th>交出 / 收到</th><th>质量与跟进</th><th>操作</th></tr></thead><tbody>${scopedTransfers().map(j=>{let t=tById(j.task),r=received(j);return `<tr><td>${j.id}<span class="sub">${esc(t.name)} · ${t.code}</span><span class="sub">${esc(workorderLabel(t))}</span><span class="sub">${date(j.date)}</span></td><td>${routeText[j.route]}<span class="sub">${esc(j.from)} → ${esc(j.to)}</span></td><td><strong>${j.sent} / ${j.receipts.length?r:'未确认'}</strong><span class="sub">${j.receipts.length?(r===j.sent?'数量一致':r<j.sent?'差异 '+(j.sent-r)+' 件待核实':'接收多 '+(r-j.sent)+' 件待核实'):'等待接收反馈'}</span></td><td>${badge(j.route==='return'?'回厂后按需检验':t.needQ===null?'质量要求待确认':t.needQ?(j.qAtSend===null?'登记时质量依据待确认':'登记时示例合格 '+j.qAtSend+' 件'):'本次检验不适用',j.route!=='return'&&t.needQ&&(j.qAtSend===null||j.qAtSend<j.sent)?'warn':'neutral')}<span class="sub">${esc(j.note||'无补充说明')}</span>${j.updates.length?'<span class="sub">最新跟进：'+esc(j.updates.at(-1).text)+'</span>':''}</td><td>${canEdit(t)?`<button class="link edit-receipt" data-id="${j.id}">接收 / 差异跟进</button>`:'只读'}</td></tr>`}).join('')}</tbody></table></div><div class="callout info">已收到的数量独立于加工完成和质量合格。回厂待检不会被拦成“无法接收”；直送未经质量放行的实际情况可记录为异常，后续加工仍须满足质量要求。差异核实不自动修改双方历史记录。</div></section><div class="overview" style="margin-top:18px"><section class="panel"><h2>三种实际路径</h2><p>厂内交接：交出班组填写，接收班组核数量确认，项目负责人登记结果。</p><p>外协回厂：先登记返回接收，再按需报检，合格后进入适用后续环节。</p><p>外协直送：现场检验取得所需放行，直接交下一家，由下家核对并反馈收到。</p></section><section class="panel"><h2>还需核实的规则</h2><p class="quiet">已交出与已确认收到独立保存；更正须说明原因并保留原记录。返回可关联核实的一批或多批原送出，未知映射保持待确认。真实单据及接口证据暂无，本页不实现通用更正与多批映射。</p></section></div>`;}
function renderOverview(){let w=woById(scope),all=orderAttention(w.id),shown=all.filter(x=>attentionMatch(x,attentionFilter)),ts=scopedTasks();return `<div class="heading"><div><h1>工单详情</h1><p>${esc(w.number)} · ${esc(w.equipment)}</p></div></div>${projectStrip()}<div class="stage-strip"><div><span class="quiet small">当前阶段</span><br><strong>${esc(w.acceptance?'履约完成':w.stage)}</strong></div><div><p>合同交期 ${esc(w.due)}</p><p class="quiet">预计首批发货 ${esc(state.demo?forecast(demo(w.id)).status:"待评估")} · ${w.acceptance?'客户已签字验收':'客户未签字验收'}</p></div><div><p>已录入 ${ts.length} 条部件工序</p><p class="quiet">${ts.filter(t=>t.done<t.qty&&t.started).length} 条在制 / ${ts.filter(t=>!t.started).length} 条未开工 / ${ts.filter(t=>t.done===t.qty).length} 条加工完成</p></div></div><h2>需要关注 <span class="quiet small">${all.length} 项</span></h2><div class="status-tabs">${[['all','全部'],['blocked','阻塞 / 差异'],['late','预计偏差'],['unknown','待确认']].map(([k,l])=>`<button data-attention-filter="${k}" aria-pressed="${attentionFilter===k}">${l}</button>`).join('')}</div><section class="panel attention-list">${shown.map(attentionRow).join('')||'<div class="empty">当前筛选没有已记录的关注事项。</div>'}</section><div class="actions"><button data-wo-view="progress">查看全部任务</button><details><summary>安排与交接</summary><div class="actions"><button data-wo-view="dispatch">任务安排</button><button data-wo-view="handoff">交接记录</button></div></details></div><details class="task-expand"><summary>展开生产计划与数量明细</summary><section class="panel"><div class="table-wrap"><table><thead><tr><th>部件 / 图号</th><th>工序 / 执行方</th><th>计划 / 要求</th><th>当前预计</th><th>加工完成</th><th>检验结果</th></tr></thead><tbody>${ts.map(t=>`<tr><td><button class="link jump-task" data-id="${t.id}">${esc(t.name)}</button><span class="sub">${esc(t.code)}</span></td><td>${esc(t.op)}<span class="sub">${esc(t.executor)}</span></td><td>${date(t.plan)} / ${date(t.due)}</td><td>${t.unknown?'上次记录 '+date(t.forecast):date(t.forecast)}</td><td>${t.done} / ${t.qty} 件</td><td>${esc(qText(t))}</td></tr>`).join('')}</tbody></table></div></section></details><details class="task-expand"><summary>展开项目资料与其他阶段</summary><section class="panel"><p>${esc(w.project)} · ${esc(w.contract)} · ${esc(w.customer)}</p><p>设计、采购、工艺、总装、调试、发运及现场明细尚未录入。局部工序偏差需结合后续计划评估，整机预计交付日期不由这些工序直接推算。</p></section></details>`;}

function bindView(){
 document.querySelectorAll('[data-library-tab]').forEach(b=>b.onclick=()=>{libraryStatus=b.dataset.libraryTab;render();});
 document.querySelectorAll('[data-attention-filter]').forEach(b=>b.onclick=()=>{attentionFilter=b.dataset.attentionFilter;render();});
 document.querySelectorAll('.jump-handoff').forEach(b=>b.onclick=()=>{view='handoff';render();});

 document.querySelectorAll('.open-wo').forEach(b=>b.onclick=()=>openWorkorder(b.dataset.wo));
 document.querySelectorAll('[data-wo-view]').forEach(b=>b.onclick=()=>{view=b.dataset.woView;render();});
 if($('scope'))$('scope').onchange=e=>{selectScope(e.target.value);render();};
 if($('backLibrary'))$('backLibrary').onclick=()=>{view='library';render();};
 if($('goOverview'))$('goOverview').onclick=()=>{view='overview';render();};
 if($('allProduction'))$('allProduction').onclick=()=>{selectScope('all');view='progress';render();};
 if($('librarySearch'))$('librarySearch').oninput=e=>{librarySearch=e.target.value;let pos=e.target.selectionStart;render();$('librarySearch').focus();$('librarySearch').setSelectionRange(pos,pos);};
 for(const [id,key] of [['libraryBusiness','business'],['libraryLead','lead'],['libraryStatus','status']])if($(id))$(id).onchange=e=>{if(key==='business')libraryBusiness=e.target.value;if(key==='lead')libraryLead=e.target.value;if(key==='status')libraryStatus=e.target.value;render();};
document.querySelectorAll('.select-task').forEach(b=>b.onclick=()=>{let checked=[...document.querySelectorAll('.rowcheck:checked')].map(c=>c.value);selected=b.dataset.id;render();document.querySelectorAll('.rowcheck').forEach(c=>c.checked=checked.includes(c.value));if($('taskDetail'))$('taskDetail').open=true;});document.querySelectorAll('.edit-progress').forEach(b=>b.onclick=()=>openProgress(b.dataset.id));document.querySelectorAll('.new-transfer').forEach(b=>b.onclick=()=>openTransfer(b.dataset.id));document.querySelectorAll('.reassign').forEach(b=>b.onclick=()=>openReassign(b.dataset.id));document.querySelectorAll('.edit-receipt').forEach(b=>b.onclick=()=>openReceipt(b.dataset.id));document.querySelectorAll('.jump-task').forEach(b=>b.onclick=()=>{search='';filter='all';executorFilter='all';selected=b.dataset.id;view='progress';render();if($('taskDetail')){$('taskDetail').open=true;$('taskDetail').scrollIntoView?.({block:'nearest'});}});if($('search'))$('search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos);};if($('filter'))$('filter').onchange=e=>{filter=e.target.value;render();};if($('exFilter'))$('exFilter').onchange=e=>{executorFilter=e.target.value;render();};if($('allcheck'))$('allcheck').onchange=e=>document.querySelectorAll('.rowcheck:not(:disabled)').forEach(c=>c.checked=e.target.checked);if($('bulk'))$('bulk').onclick=()=>{let ids=[...document.querySelectorAll('.rowcheck:checked')].map(c=>c.value);if(!ids.length)return notice('请先选择已核实、可确认的任务。');openBulk(ids);};if($('dispatchNew'))$('dispatchNew').onclick=()=>openDispatch([...document.querySelectorAll('.dcheck:checked')].map(c=>c.value));if($('chooseTransfer'))$('chooseTransfer').onclick=()=>openChooseTransfer();}
function showModal(title,body,onSave,saveText='保存演示记录'){let m=$('modal');m.innerHTML=`<form id="modalForm"><div class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button type="button" id="modalClose" aria-label="关闭">×</button></div><div class="modal-body">${body}<div id="formError" class="error" role="alert"></div></div><div class="modal-foot"><button type="button" id="modalCancel">取消</button><button type="submit" class="primary">${esc(saveText)}</button></div></form>`;$('modalClose').onclick=$('modalCancel').onclick=()=>m.close();$('modalForm').onsubmit=e=>{e.preventDefault();$('formError').textContent='';try{onSave();}catch(err){$('formError').textContent=err.message;}};if(!m.open)m.showModal();}
function finish(msg){$('modal').close();render();notice(msg);}
function requireRole(r){if(role!==r)throw Error('请切换对应角色后操作。');}
function val(id){return $(id).value.trim();}
function integer(id,min,max){let raw=val(id),n=Number(raw);if(raw===''||!Number.isInteger(n)||n<min||n>max)throw Error('数量应为 '+min+' 至 '+max+' 的整数。');return n;}
function occurrence(id){let d=val(id);if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d>TODAY)throw Error('实际发生日期应填写示例今日或之前的日期。');return d;}
function log(task,text,eventDate=TODAY){state.logs.push({task,text,date:eventDate});}
function openProgress(id){if(role!=='lead')return;let t=tById(id);if(!canEdit(t))return notice('此工单由另一位生产项目负责人维护。');showModal('更新进度 · '+t.name,`<p class="small quiet">${esc(workorderLabel(t))}<br>${esc(t.code)} · ${esc(t.op)} · ${esc(t.executor)}<br>分配 ${t.qty} 件，已加工完成 ${t.done} 件；原要求 ${esc(t.due)}。</p><div class="form-grid"><label>开工情况<select id="pStarted"><option value="yes" ${t.started?'selected':''}>已开始</option><option value="no" ${!t.started?'selected':''}>尚未开工</option></select></label><label>累计已核实开工数量（无新依据可留空）<input id="pStartQty" type="number" min="0" max="${t.qty}" step="1" value="${t.startQty??''}"></label><label>本次新增加工完工数量<input id="pDone" type="number" min="0" max="${t.qty-t.done}" step="1" value="0"></label><label>实际发生日期<input id="pDate" type="date" value="${TODAY}" max="${TODAY}" required></label><label>当前预计完成日期（可空）<input id="pForecast" type="date" value="${t.forecast||''}"></label><label>最新情况<select id="pKnown"><option value="known" ${!t.unknown?'selected':''}>本次已核实</option><option value="unknown" ${t.unknown?'selected':''}>最新情况待确认</option></select></label><label>信息来源<input id="pSource" placeholder="如班组长 / 外协反馈" value="${t.executor.includes('外协')?'外协反馈':'班组长反馈'}" required></label><label class="full">阻塞与现场情况<textarea id="pBlock" rows="3">${esc(t.blocker)}</textarea></label></div><div class="callout info">本次数量只登记首次达到本工序完工节点的新增数量。返工不作为新增产出；加工完成不自动修改 QMS 或交接结果。标为待确认时，保留上次已知进展。</div>`,()=>{requireRole('lead');if(!canEdit(t))throw Error('当前负责人不能修改此工单。');let n=integer('pDone',0,t.qty-t.done),known=val('pKnown')==='known',started=val('pStarted')==='yes';let forecast=val('pForecast')||null,block=val('pBlock'),source=val('pSource'),d=occurrence('pDate');if(!source)throw Error('请填写信息来源。');if(!known&&(n||started!==t.started||forecast!==t.forecast||block!==t.blocker))throw Error('最新情况待确认时请保留原进展；有可靠的新事实请选择“本次已核实”。');if((n+t.done)>0&&!started)throw Error('已登记加工完成，不能同时记为尚未开工。');const startQty=val('pStartQty')===''?t.startQty:integer('pStartQty',0,t.qty);if(startQty!==null&&(t.done+n>startQty||(!started&&startQty>0)))throw Error('完工或未开工状态与可靠开工数量矛盾，请核实。');if(t.startQty!==null&&startQty<t.startQty)throw Error('累计开工不能减少，更正须另留记录和原因。');if(!known&&startQty!==t.startQty)throw Error('待确认时保留原开工数量。');if(t.id==='A05'&&started&&!t.started)throw Error('需要放行的下道开工请使用同批范围交集演示，不允许通用进度绕过。');if(t.id==='A03'&&demo(t.wo).pause&&(n>0||started!==t.started))throw Error('受影响 2 件技术暂停中，正常进度不能绕过；暂停前事实另按可信证据补录。');t.startQty=startQty;t.done+=n;t.started=started;t.forecast=forecast;t.blocker=block;t.unknown=!known;if(known)t.confirmed=TODAY;log(id,`${source}：本次新增完工 ${n} 件，累计 ${t.done} 件；预计 ${forecast||'待确认'}；${known?'已核实':'最新情况待确认'}。`,d);finish('进度已更新，原要求日期与质量结果保持独立。');});}
function openBulk(ids){if(ids.some(id=>!canEdit(tById(id))))return notice('仅能确认当前负责人负责的工单。');showModal('确认进展未变',`<p>请确认已取得这些任务的最新反馈。仅更新最近确认时间，不改数量、日期或问题。</p><div class="inset">${ids.map(id=>{let t=tById(id);return `<div>${esc(workorderLabel(t))} · ${esc(t.name)} · ${esc(t.op)} · ${esc(t.executor)}</div>`;}).join('')}</div><label class="checkline"><input id="bChecked" type="checkbox" required>我已核实所选明细，进展与上次相同</label>`,()=>{requireRole('lead');if(!$('bChecked').checked)throw Error('请先核实所选明细。');ids.forEach(id=>{let t=tById(id);if(!canEdit(t))throw Error('当前负责人不能修改此工单。');if(t.unknown)throw Error('待确认明细请单独更新。');});ids.forEach(id=>{tById(id).confirmed=TODAY;log(id,'最新反馈已核实，进展未变。');});finish('已确认 '+ids.length+' 条明细，数量和预计日期未改变。');},'确认进展未变');}
function openDispatch(ids){if(role!=='planner')return;if(!ids.length)return notice('先选择需要安排的部件。');let ds=ids.map(id=>state.demands.find(d=>d.id===id));if(new Set(ds.map(d=>d.wo)).size!==1)return notice('本原型一次安排同一工单，请先选择一个工单。必须按工单分别安排，不允许跨工单任务包。');if(new Set(ds.map(d=>d.op)).size!==1)return notice('本原型按一道工序整包安排，请选择同工序明细。');showModal('整包安排 · '+ds[0].op,`<p class="small quiet">${esc(woById(ds[0].wo).number)} · 由统一派工负责人直接安排</p><div class="form-grid"><label>执行方<select id="dExecutor">${options(executors.filter(x=>x!=='工厂接收'),ds[0].op==='机加工'?executors[1]:executors[0])}</select></label><label>整包要求完成日期<input id="dDue" type="date" value="${ds[0].plan}" required></label></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>图号 / 部件</th><th>未安排</th><th>本次安排</th><th>先后要求（可选）</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${d.code}<span class="sub">${esc(d.name)}</span></td><td>${remaining(d)}</td><td><input id="dq${d.id}" type="number" min="1" max="${remaining(d)}" value="${remaining(d)}" required style="width:80px"></td><td><input id="dp${d.id}" placeholder="如本项先完成" style="min-width:120px"></td></tr>`).join('')}</tbody></table></div><div class="callout info">保存后新增任务包，所有明细初始未开工，预计日期待确认。保存即生效，无单独下达或执行方确认步骤；提前指定不等于通知、收到或开工。</div>`,()=>{requireRole('planner');let counts=ds.map(d=>integer('dq'+d.id,1,remaining(d))),ex=val('dExecutor'),due=val('dDue');if(!due)throw Error('请填写整包要求日期。');if(demo(ds[0].wo).supplier!=='active'&&ex.includes('外协'))throw Error('虚构 QMS 资格停用或待核实，禁止新增外协派工。');let pkg='DEMO-P'+(state.tasks.length+1);ds.forEach((d,i)=>{let id='A'+String(state.tasks.length+1).padStart(2,'0');state.tasks.push({id,pkg,wo:d.wo,demand:d.id,code:d.code,name:d.name,op:d.op,executor:ex,qty:counts[i],done:0,started:false,startQty:null,plan:d.plan,due,forecast:null,confirmed:TODAY,unknown:false,blocker:'',needQ:null,qpass:null,qfail:0,qwhere:'要求待确认',qref:'新任务质量要求待确认',rework:0,priority:val('dp'+d.id)});log(id,'已指定执行方；尚未开工，质量要求待确认。');});finish('整包安排已保存，未自动记开工。');});}

function openTransfer(id){if(role!=='lead')return;let t=tById(id),external=t.executor.includes('外协');if(!canEdit(t))return notice('此工单由另一位负责人登记交接。');showModal('登记一批交接 · '+t.name,`<p class="small quiet">${esc(workorderLabel(t))}<br>${t.code} · ${esc(t.op)} · 交出方 ${esc(t.executor)}<br>加工完成 ${t.done} / 分配 ${t.qty} 件；${esc(qText(t))}（示例快照）。</p><div class="form-grid"><label>实际路径<select id="jRoute">${external?'<option value="return">外协回厂</option><option value="direct">外协直送下一家</option>':'<option value="internal">厂内交接</option>'}</select></label><label>实际接收方<select id="jTo"></select></label><label>本批交出数量<input id="jSent" type="number" min="1" max="${t.qty}" required></label><label>实际交出日期<input id="jDate" type="date" value="${TODAY}" max="${TODAY}" required></label><label>本批实际收到数量（未确认留空）<input id="jReceived" type="number" min="0" step="1"></label><label>实际收到日期<input id="jReceivedDate" type="date" value="${TODAY}" max="${TODAY}"></label><label class="full">接收反馈来源<input id="jSource" placeholder="如接收班组确认 / 下家微信反馈"></label><label class="full">实际情况说明<textarea id="jNote" rows="2" placeholder="数量差异、返回原因或质量异常"></textarea></label></div><div id="routeHint" class="callout info"></div>`,()=>{requireRole('lead');if(!canEdit(t))throw Error('当前负责人不能修改此工单。');let route=val('jRoute'),to=val('jTo'),n=integer('jSent',1,t.qty),d=occurrence('jDate'),r=val('jReceived')===''?null:integer('jReceived',0,9999),rd=r===null?null:occurrence('jReceivedDate'),source=val('jSource'),note=val('jNote');if(!to||to===t.executor)throw Error('请选择真实接收方。');if(rd&&rd<d)throw Error('接收日期不能早于交出日期。');if(r!==null&&!source)throw Error('已收到时请填写接收反馈来源。');if(t.id==='A03'&&demo(t.wo).pause)throw Error('技术暂停范围不允许正常转序；已发生违规另留异常事实。');let cap=(route==='return'?t.qty:t.done)-sentSum(t);if(n>cap)throw Error('本示例不演示重复往返，本批超过当前未记录交出范围 '+Math.max(0,cap)+' 件。');let qUnknown=t.needQ===null,violation=route!=='return'&&(qUnknown||(t.needQ&&(t.qpass===null||n+sentSum(t)>t.qpass)));if((violation||(r!==null&&r!==n))&&!note)throw Error('质量依据不足或数量不一致，请补充实际情况说明。');let jid='J'+String(state.transfers.length+1).padStart(3,'0');state.transfers.push({id:jid,task:id,route,from:t.executor,to,sent:n,date:d,receipts:r===null?[]:[{qty:r,date:rd,source}],qAtSend:t.qpass,qualityException:violation,note:(violation?'质量依据不足，后续加工需核实放行。 ':'')+note,updates:[]});log(id,`${routeText[route]}：交出 ${n} 件至 ${to}，${r===null?'接收未确认':'实际收到 '+r+' 件'}。`,d);finish('交接已登记；加工进度、质量结果和下道开工未自动改变。');});let sync=()=>{let route=val('jRoute');$('jTo').innerHTML=options(route==='return'?['工厂接收']:route==='direct'?executors.filter(x=>x.includes('外协')&&x!==t.executor):['组焊一班','机加班','厂内待总装区'],null);$('routeHint').textContent=route==='return'?'先记录实际回厂接收，再按需报检。未检验合格不阻止登记回厂。':'记录真实交出和接收。需要质量放行的后续加工须满足检验要求；原型允许记录实际异常并要求说明，不自动视为已放行。';};$('jRoute').onchange=sync;sync();}
function openReceipt(id){if(role!=='lead')return;let j=state.transfers.find(x=>x.id===id),t=tById(j.task);if(!canEdit(t))return notice('此工单由另一位负责人跟进。');showModal('接收与差异跟进 · '+id,`<p>${esc(workorderLabel(t))}<br>${esc(t.name)} · ${esc(j.from)} → ${esc(j.to)}<br>交出 ${j.sent} 件，已确认收到 ${received(j)} 件。</p><div class="inset small">${j.receipts.map(r=>`${esc(r.date)} 收到 ${r.qty} 件 · ${esc(r.source)}`).join('<br>')||'尚未取得接收反馈。'}${j.updates.map(u=>'<br>'+esc(u.date)+' 跟进：'+esc(u.text)).join('')}</div><div class="form-grid"><label>本次新增实际收到数量<input id="vQty" type="number" min="0" step="1" value="0"></label><label>实际收到日期<input id="vDate" type="date" max="${TODAY}" value="${TODAY}" required></label><label class="full">本次接收反馈来源<input id="vSource" placeholder="新增接收时填写核实来源"></label><label class="full">核实情况 / 跟进结果<textarea id="vNote" rows="3" placeholder="由生产项目负责人联系双方核实；不覆盖原交出记录"></textarea></label></div><div class="callout info">这里增加新收到的数量，不重复输入累计数量。仅跟进差异时新增数量填 0；尚无接收反馈时，填 0 并填写来源可确认实际收到 0 件。记录纠错权限未定，原型保留历史，不提供直接改掉原数量的操作。</div>`,()=>{requireRole('lead');if(!canEdit(t))throw Error('当前负责人不能修改此工单。');let n=integer('vQty',0,9999),d=occurrence('vDate'),source=val('vSource'),note=val('vNote');if(d<j.date)throw Error('接收日期不能早于交出日期。');if(n&&!source)throw Error('新增接收请填写反馈来源。');if(!n&&!note&&!(!j.receipts.length&&source))throw Error('请填写新增接收或核实结果。');if(received(j)+n>j.sent&&!note)throw Error('累计接收超过交出，请说明实际数量差异。');if(n||(!j.receipts.length&&source))j.receipts.push({qty:n,date:d,source});if(note)j.updates.push({date:TODAY,text:note});log(t.id,`${id}：新增收到 ${n} 件，累计 ${received(j)} 件；${note||source}`,d);finish('接收与跟进结果已追加，原记录保留。');});}

function forecast(d){if(!d.rangeConfirmed)return {status:'待评估',reason:'首批范围尚未经项目部首次确认'};if(d.debugDays===null)return {status:'待评估',reason:'必要调试工期未知'};if(d.dependency!=='normal')return {status:'待评估',reason:d.dependency==='cycle'?'任务依赖存在循环':'必要发出节点未关联'};let anchored=addCalendarDays(d.base,d.remaining);if(d.forecastDate&&d.forecastDate!==anchored)return {status:'待评估',reason:'直接日期与固定基准剩余工期矛盾'};if(anchored<d.forecastToday)return {status:'待评估',reason:'未完任务预计日期已过，需核实'};

 forecast(){demoForm('首批范围与预测依据',`<div class="form-grid"><label>首批范围<select id="fRange"><option value="full">主机及附件</option><option value="small">主机（附件后续批次）</option></select></label>${numField('fDays','必要调试剩余自然日（未知留空）',demo().debugDays)}<label>本次工期录入基准<input id="fBase" type="date" value="${demo().base}" required></label>${numField('fRemaining','制造还需自然日',demo().remaining)}<label>制造直接预计（可空，填写须一致）<input id="fDate" type="date" value="${demo().forecastDate}"></label><label>模拟重算日期<input id="fToday" type="date" value="${demo().forecastToday}" required></label><label>依赖完整性<select id="fDependency"><option value="normal">完整：制造至实际发出</option><option value="cycle">模拟依赖循环</option><option value="missing">模拟缺实际发出节点</option></select></label>${reasonField()}</div><div class="callout info">初次确认仅项目部；已确认后生产项目负责人或项目部修改立即重算。范围变动不缩减合同，缺调试或关键依赖保持待评估。固定基准录入 10 月 13 日还需 3 天，制造为 10 月 16 日，不随重算日漂移。</div>`,d=>{requireDemoRole(d.rangeConfirmed?'lead':'project','project');const why=reason(),days=val('fDays')===''?null:integer('fDays',0,99),remaining=integer('fRemaining',0,99),base=val('fBase'),today=val('fToday');if(!base||!today)throw Error('基准及重算日期必填。');d.forecastHistory.push({range:d.range,version:d.rangeVersion,result:forecast(d),reason:why});d.range=val('fRange');d.rangeVersion++;d.rangeConfirmed=true;d.debugDays=days;d.base=base;d.remaining=remaining;d.forecastDate=val('fDate')||null;d.forecastToday=today;d.dependency=val('fDependency');auditDemo(d,'确认或调整首批范围：'+why);});$('fRange').value=demo().range;$('fDependency').value=demo().dependency;},
 kits(){demoForm('理论齐套与现场核实',`<div class="form-grid">${numField('kPlate','连接板已知可用量（未知留空）',demo().plate)}${numField('kSite','现场确认可做套数（未知留空）',demo().siteKits)}${reasonField()}</div><p>装配 A 版：每套 2 支座、1 板；支座 7 件。仅演示已核实质量、用途及单位的可用数量。理论值不成为开工许可，现场范围独立。</p>`,d=>{requireDemoRole('lead','technical','project');const why=reason();d.plate=val('kPlate')===''?null:integer('kPlate',0,99);d.siteKits=val('kSite')===''?null:integer('kSite',0,99);auditDemo(d,'齐套核实：'+why);});},
 allocation(){demoForm('合并到货的用途分配',`<div class="form-grid">${numField('aOne','1 号工单分配数量',demo().allocations[0])}${numField('aTwo','2 号工单分配数量',demo().allocations[1])}${reasonField()}</div><p>同一虚构供给范围共 7 件，分配总量不超过 7。分配意图与实际可用独立，未接 K3，不代表库存预留或领料。</p>`,d=>{requireDemoRole('project');const a=integer('aOne',0,7),b=integer('aTwo',0,7),why=reason();if(a+b>7)throw Error('同一供给范围重复分配：总量超过 7 件。');d.allocations=[a,b];auditDemo(d,'用途分配 '+a+' / '+b+'：'+why);});},
 quality(){demoForm('切换虚构质量 / 接收快照',`<div class="form-grid"><label>质量快照<select id="qState"><option value="valid">有效合格快照</option><option value="offline">模拟 QMS 断联</option><option value="revoked">模拟结果撤销</option></select></label><label>接收范围<select id="qReceipt"><option value="same">同批 B1:1、B1:2（2 件）</option><option value="other">另一批 B2:1、B2:2、B2:3（3 件）</option><option value="unknown">批次映射未知</option></select></label></div><p>虚构质量覆盖 B1:1、B1:2、B1:3，共 3 件。B1:x 为可辨识范围示意，首版不强制逐件序列号。快照切换不改已登记历史。</p>`,d=>{d.qms=val('qState');d.receipt=val('qReceipt')==='same'?['B1:1','B1:2']:val('qReceipt')==='other'?['B2:1','B2:2','B2:3']:[];auditDemo(d,'切换虚构 QMS / 批次快照，仅用于演示');});$('qState').value=demo().qms;},
 start(){demoForm('登记正式下道开工',`<p>同批合格与实际接收交集：${esc(allowedRanges(demo()).join('、')||'无')}；已消耗范围不能重复开工。</p><div class="form-grid">${numField('sQty','本次开工数量',1,1,3)}<label>现场确认来源<input id="sSource" required></label></div>`,d=>{requireDemoRole('lead');const n=integer('sQty',1,3),source=val('sSource'),ranges=allowedRanges(d);if(!source)throw Error('请填写现场确认来源。');if(d.qms!=='valid')throw Error('质量依据待核实，拒绝正式开工。');if(n>ranges.length)throw Error('开工范围超出同批合格、接收且未消耗的交集。');const selected=ranges.slice(0,n);d.used.push(...selected);d.officialStarts.push({allowedAt:TODAY,ranges:selected,exceptionRefs:d.exceptions.filter(x=>selected.includes(x.range)).map(x=>({date:x.date,range:x.range}))});auditDemo(d,'正式开工 '+n+' 件，范围 '+ranges.slice(0,n).join('、')+'；'+source);});},
 exception(){demoForm('留存未放行提前流转事实',`<div class="form-grid"><label>真实发生日期<input id="xDate" type="date" max="${TODAY}" value="${TODAY}" required></label><label>数量范围<input id="xRange" value="B2:1" required></label><label>责任人<input id="xOwner" required></label>${reasonField()}</div><p>异常保留真实时间、范围及责任，不增加正式开工。后续满足质量及接收条件后，另记正式允许开工。</p>`,d=>{requireDemoRole('lead');const date=occurrence('xDate'),range=val('xRange'),owner=val('xOwner'),why=reason();if(!range||!owner)throw Error('范围和责任人必填。');d.exceptions.push({date,range,owner,reason:why});auditDemo(d,'未放行提前流转事实已留存，正式开工不变');});},
 rework(){demoForm('登记原件返工返回',`<p>原任务 A01 · 原件 B1:4 · 虚构不合格依据 DEMO-NG-1。额外返工过程与首次产出分开，同一返回事件重复提交不追加。</p>${reasonField()}`,d=>{requireDemoRole('lead');const why=reason();if(d.reworks.some(x=>x.event==='RW-RETURN-1'))throw Error('该原件本次返工返回已登记，不重复计入。');d.reworks.push({event:'RW-RETURN-1',range:'B1:4',reason:why,reinspection:'待重新检验'});auditDemo(d,'原件返工返回，首次产出仍为 '+tById('A01').done+' 件');});},
 pause(){demoForm('技术暂停与恢复确认',`<p>暂停只覆盖连接件 C1:1、C1:2，共 2 件；其他范围可继续。技术要求落实与现场恢复两项齐备才解除，解除后仍核对质量。</p><label class="checkline"><input id="pTech" type="checkbox" ${demo().technical?'checked':''}>技术要求已落实（技术维护）</label><label class="checkline"><input id="pSite" type="checkbox" ${demo().site?'checked':''}>现场具备恢复条件（生产项目负责人维护）</label>${reasonField()}`,d=>{requireDemoRole('technical','lead');const why=reason(),tech=$('pTech').checked,site=$('pSite').checked;if(role!=='technical'&&tech!==d.technical)throw Error('技术落实结论由技术维护。');if(role!=='lead'&&site!==d.site)throw Error('现场恢复由生产项目负责人维护。');d.technical=tech;d.site=site;d.pause=!(tech&&site);auditDemo(d,(d.pause?'仍暂停':'暂停解除')+'：'+why);});},
 historical(){demoForm('暂停前事实补录示意',`<p>虚构证据仅覆盖 C1:1 于 2026-10-12 完工的原事实。不能任填旧日期绕过暂停；真实证据细则依赖 E02。</p><div class="form-grid"><label>发生日期<input id="hDate" type="date" value="2026-10-12"></label><label>证据引用<input id="hEvidence" value="DEMO-BEFORE-PAUSE"></label></div>`,d=>{requireDemoRole('lead');if(val('hDate')!=='2026-10-12'||val('hEvidence')!=='DEMO-BEFORE-PAUSE')throw Error('发生时间或可信证据不匹配，不能倒填绕过暂停。');if(d.historical.length)throw Error('该历史事实已登记。');d.historical.push({occurred:'2026-10-12',entered:TODAY,evidence:'DEMO-BEFORE-PAUSE'});auditDemo(d,'补录暂停前示意事实；未增加正式首次产出');});},
 issue(){demoForm('关闭普通问题 / 更新现场恢复',`<p>孔位问题：责任部门负责人关闭；生产项目负责人独立更新现场是否恢复。问题关闭不解除技术暂停。</p><label class="checkline"><input id="iClose" type="checkbox" ${demo().issueClosed?'checked':''}>部门已确认处理完成</label><label class="checkline"><input id="iSite" type="checkbox" ${demo().siteRecovered?'checked':''}>现场已恢复</label>${reasonField()}`,d=>{requireDemoRole('department','lead');const why=reason(),closed=$('iClose').checked,site=$('iSite').checked;if(role!=='department'&&closed!==d.issueClosed)throw Error('问题关闭由责任部门负责人维护。');if(role!=='lead'&&site!==d.siteRecovered)throw Error('现场恢复由生产项目负责人维护。');d.issueClosed=closed;d.siteRecovered=site;auditDemo(d,'问题 '+(closed?'关闭':'处理中')+' / 现场 '+(site?'恢复':'未恢复')+'：'+why);});},
 extension(){demoForm('措施延期申请与确认',`<p>原期限 ${demo().deadline}；模拟 10 月 13 日已逾期，保留升级事件。未发送真实通知；多部门分管领导、收件人配置、送达重试待真实验证。</p><div class="form-grid"><label>新期限<input id="eDate" type="date" value="2026-10-16" min="${TODAY}" required></label>${reasonField()}</div>`,d=>{requireDemoRole('executor','project');const why=reason(),date=val('eDate');if(date<TODAY)throw Error('新期限不得早于演示今日。');if(role==='executor'){d.extension={date,reason:why};d.measureHistory.push('延期申请：'+date+'，待项目部确认');}else{if(!d.extension)throw Error('请先由执行人提出延期申请。');if(date!==d.extension.date)throw Error('确认日期须匹配申请。');d.measureHistory.push('项目部确认延期：原期限 '+d.deadline+'，新期限 '+date+'；旧逾期和升级保留');d.deadline=date;d.extension=null;}auditDemo(d,'措施延期处理：'+why);});},
 docs(){demoForm('资料版本 A → B 接收',`<p>原任务仍引用 A 版，最新下发 B 版；纸质或现有渠道，图纸不强制上传。部门独立确认，新版已发不代表旧图已收回。</p><div class="form-grid"><label>接收部门<select id="vDept"><option value="craft">工艺</option><option value="production">生产</option></select></label></div>${reasonField()}`,d=>{requireDemoRole('technical','lead');const why=reason();d.docs[val('vDept')]=true;auditDemo(d,'资料 B 版部门接收：'+val('vDept')+'；'+why);});},
 supplier(){demoForm('虚构 QMS 资格快照',`<label>外协资格<select id="vSupplier"><option value="active">有效</option><option value="disabled">停用 / 取消资格</option><option value="unknown">资格待核实</option></select></label><p>停用或未知禁止新增派工；已有任务保留并标风险，不自动取消。身份、主数据均未连接 QMS。</p>`,d=>{d.supplier=val('vSupplier');auditDemo(d,'切换虚构资格快照：'+d.supplier);});},
 acceptance(){demoForm('销售登记逐设备验收结果',`<p>同份虚构签字文件 DEMO-SIGN-1 涵盖 3 台设备（跨项目）；逐台明确结果，遗留不阻止通过设备履约完成。</p><label>签字依据引用<input id="cEvidence" value="DEMO-SIGN-1" required></label>${state.workorders.map(w=>`<label class="checkline"><input type="checkbox" id="c${w.id}" ${w.acceptance?'checked':''}>${esc(w.number)} 验收通过</label>`).join('')}`,d=>{requireDemoRole('sales');if(!val('cEvidence'))throw Error('签字依据必填。');if(state.workorders.some(w=>w.acceptance&&!$('c'+w.id).checked))throw Error('验收撤销例外待制度核实，本原型不允许普通更正撤销完成。');state.workorders.forEach(w=>{w.acceptance=$('c'+w.id).checked;w.acceptanceEvidence=val('cEvidence');});auditDemo(d,'销售按设备登记验收结果；无项目部再次审批');});},
 close(){demoForm('项目部关闭项目与遗留承接',`<p>核对本项目全部工单、正式合同范围。可带遗留关闭，每项必须有责任人、期限、承接部门；关闭后待办和逾期继续。</p><label class="checkline"><input id="cScope" type="checkbox">已核对合同全部范围</label><div class="form-grid"><label>遗留责任人<input id="cOwner" required></label><label>承接部门<input id="cDept" required></label><label>遗留期限<input id="cDate" type="date" value="2026-10-16" required></label></div>`,d=>{requireDemoRole('project');const project=woById(scope).project;if(state.workorders.some(w=>w.project===project&&!w.acceptance))throw Error('项目仍有未验收通过的工单，不能关闭。');if(!$('cScope').checked||!val('cOwner')||!val('cDept')||!val('cDate'))throw Error('合同范围和遗留承接信息不完整。');state.projectClose[project]={owner:val('cOwner'),department:val('cDept'),deadline:val('cDate'),closed:true};auditDemo(d,'项目带遗留关闭；遗留待办继续跟踪');});},
 handover(){demoForm('人员停用后的履约职责移交',`<p>虚构原人员已停用；任务、问题、待办一起移交，原行为人及责任历史保留，接收提醒不自动获得写权限。</p><label>新责任人<input id="oNew" required></label>${reasonField()}`,d=>{requireDemoRole('department','project');const why=reason(),owner=val('oNew');if(!owner||owner===d.owner)throw Error('请指定不同的接替人。');d.handover.push({from:d.owner,to:owner,reason:why,objects:['未完成任务','问题','遗留待办']});d.owner=owner;const p=state.projectClose[woById(scope).project];if(p){p.previousOwner=p.owner;p.owner=owner;}auditDemo(d,'履约职责移交给 '+owner+'，原行为人保留');});}
};
function demoButton(action,label){return `<button data-demo-action="${action}">${label}</button>`;}
function renderBusiness(){const d=demo(),f=forecast(d),w=woById(scope),p=state.projectClose[w.project];if(scope!=='W01')return '<section class="panel section-line"><p>本轮可操作业务规则样例集中在 DEMO-2610-01；其他工单保留状态与各自任务。请在工单选择中切换至 1 号设备演示规则，避免将不同工单的示例范围混用。</p></section>';return `<details class="task-expand" id="businessRules"><summary>首批预测、齐套与履约规则演示</summary><div class="overview rule-grid">
<section class="panel"><h2>预计首批发货日期</h2><strong id="prediction">${esc(f.status)}</strong><p>${esc(f.reason)}</p><p>首批 ${d.range==='full'?'主机及附件':'主机'} · v${d.rangeVersion} · ${d.rangeConfirmed?'首次已确认':'待项目部首次确认'}</p>${demoButton('forecast','维护首批范围与依据')}<h3 class="section-line">合同节点单独核对</h3><p>首批发出承诺 2026-10-25：${/^2026/.test(f.status)?f.status>'2026-10-25'?'已识别交期风险':'首批预计按时':'待评估'}</p><p>全部发完 ${w.due}：待评估，缺对应预计；到货 / 装船：待评估，缺对应依据。客户验收不自动预测。</p><details><summary>范围与预测历史 ${d.forecastHistory.length} 条</summary>${d.forecastHistory.map(x=>`<p>v${x.version} ${esc(x.range==='full'?'主机及附件':'主机')} · ${esc(x.result.status)} · ${esc(x.reason)}</p>`).join('')}</details></section>
<section class="panel"><h2>理论齐套与实物可做范围</h2><p id="kitResult">${esc(theoretical(d))}</p><p>支座 7 件 / 每套 2；连接板 ${d.plate===null?'未知':d.plate+' 件'} / 每套 1。未知不能填零。</p><p>现场确认：${d.siteKits===null?'待核实':d.siteKits+' 套'}；实际范围与质量、暂停继续独立核对。</p>${demoButton('kits','维护齐套核实')}<p>同批到货 7 件，分配意图 ${d.allocations.join(' / ')}；实际可用另核实。</p>${demoButton('allocation','核对合并到货分配')}</section>
<section class="panel"><h2>同批质量与接收交集</h2><p>QMS：${esc({valid:'虚构有效快照',offline:'模拟断联 · 质量依据待核实',revoked:'模拟撤销 · 禁止新开工'}[d.qms])}；质量 B1:1–3</p><p>实际收到：${esc(d.receipt.join('、')||'批次对应未知')}；可正式开工 ${allowedRanges(d).length} 件</p><p>已正式开工 ${d.used.length} 件；违规事实 ${d.exceptions.length} 条；原件返工返回 ${d.reworks.length} 条 / 首次产出 ${tById('A01').done} 件。返工重新检验待确认。</p><div class="actions">${demoButton('quality','切换虚构质量快照')}${demoButton('start','登记正式下道开工')}${demoButton('exception','留存违规实际事实')}${demoButton('rework','登记原件返工返回')}</div>${d.exceptions.map(x=>`<p>违规发生 ${esc(x.date)} · ${esc(x.range)} · ${esc(x.owner)} · ${esc(x.reason)}</p>`).join('')}</section>
